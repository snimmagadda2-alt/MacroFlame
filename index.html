<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share and Macro Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #3700b3;
        }
        video {
            width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border: 1px solid #333;
            display: none;
        }
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 15px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Remote Automation Suite</h2>
        <p>Click below to grant screen-sharing access and initialize control protocols.</p>
        <button id="startBtn">Request Screen Permission</button>
        
        <video id="screenPreview" autoplay playsinline></video>
        
        <textarea id="macroInput" placeholder="Type here to test macro mirroring..."></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
