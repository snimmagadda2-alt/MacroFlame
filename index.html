<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Screen Macro Recorder & Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .workspace {
            position: relative;
            width: 800px;
            height: 450px;
            background: #1e1e1e;
            border: 2px dashed #444;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video feed for screen sharing */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .placeholder-text {
            position: absolute;
            color: #666;
            font-size: 16px;
            pointer-events: none;
        }

        /* Simulated Tab / Clickable Target inside workspace */
        .tab-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
        }
        .tab-button.active {
            background-color: #6200ee;
            border-color: #bb86fc;
        }

        /* The Custom Playback Cursor */
        #customCursor {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #03dac6 40%, transparent 40%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #03dac6;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background-color: #3700b3; }
        button:disabled { background-color: #444; cursor: not-allowed; }

        textarea {
            width: 780px;
            height: 60px;
            margin-top: 15px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            resize: none;
        }
    </style>
</head>
<body>

    <!-- Custom Cursor Element -->
    <div id="customCursor"></div>

    <div class="controls-top">
        <button id="startShareBtn">Share Screen</button>
    </div>

    <div class="workspace" id="workspace">
        <div class="placeholder-text" id="placeholderText">Click "Share Screen" to begin</div>
        <video id="screenPreview" autoplay playsinline></video>
        <!-- Clickable Target / Simulated New Tab -->
        <button id="simulatedTab" class="tab-button">+ New Tab</button>
    </div>

    <div class="controls">
        <button id="recordBtn" disabled>Record</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="playBtn" disabled>Play</button>
        <br>
        <textarea id="macroInput" placeholder="Type text here while recording..."></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
